<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="mobile-board.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101114">
<title>Play — CHESS.</title>
<style>
:root{--background:#101114;--surface:#191b20;--surface-light:#22252c;--border:#30333b;--text:#f4f4f5;--muted:#999da8;--red:#c62828;--red-hover:#e53935}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:var(--background);color:var(--text);font-family:Arial,sans-serif;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
header{height:76px;padding:0 7%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:#141519}
.logo{font-size:23px;font-weight:900;letter-spacing:-1px}.logo span{color:var(--red-hover)}
header nav{display:flex;gap:26px;font-size:14px;color:var(--muted)}header nav a:hover{color:#fff}
main{flex:1;display:flex;justify-content:center;gap:28px;flex-wrap:wrap;padding:30px 20px}
.board-wrap{width:min(92vw,560px)}
.player{display:flex;justify-content:space-between;align-items:center;padding:8px 4px;font-weight:700;font-size:15px}
.player small{color:var(--muted);font-weight:400}
.tb{display:inline-block;background:#A71924;color:#fff;font-size:10px;font-weight:900;padding:2px 5px;border-radius:3px;margin-right:6px;letter-spacing:.3px;vertical-align:middle}
.av{width:28px;height:28px;border-radius:6px;object-fit:cover;vertical-align:middle;margin-right:8px}
header nav a.nav-user{background:var(--red);color:#fff;padding:9px 16px;border-radius:6px;font-weight:700}
header nav a.nav-user:hover{background:var(--red-hover)}
.clock{font-family:"Courier New",monospace;font-size:21px;background:var(--surface-light);border:1px solid var(--border);padding:5px 12px;border-radius:6px;min-width:92px;text-align:center;color:var(--muted)}
.clock.run{background:#2c3a2f;color:#fff;border-color:#42b883}
.clock.run.low{background:#4a1f21;border-color:var(--red-hover)}
.board{display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1;border-radius:6px;overflow:hidden;border:1px solid var(--border)}
.sq{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:min(9vw,52px);cursor:pointer;position:relative;user-select:none;font-family:"Segoe UI Symbol",serif}
.sq.light{background:#eeeed2}.sq.dark{background:#769656}
.sq.last{box-shadow:inset 0 0 0 100px #f6f66966}
.sq.sel{box-shadow:inset 0 0 0 100px #4aa3ff88}
.sq.check{box-shadow:inset 0 0 0 100px #e5393599}
.sq.target::after{content:"";width:28%;height:28%;border-radius:50%;background:#00000033;position:absolute}
.w{color:#fff;text-shadow:0 0 2px #000,0 0 2px #000,1px 1px 2px #000}
.b{color:#111;text-shadow:0 0 1px #fff}
.panel{width:min(92vw,320px);background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:22px;align-self:flex-start}
.panel h2{font-size:19px;margin-bottom:12px}
#status{padding:12px;border-radius:7px;background:var(--surface-light);font-size:14px;line-height:1.5;margin-bottom:16px}
#moves{height:190px;overflow:auto;background:var(--background);border:1px solid var(--border);border-radius:7px;padding:10px;font-size:13px;line-height:1.8;color:var(--muted);margin-bottom:16px}
#moves b{color:var(--text)}
label{display:block;font-size:12px;font-weight:700;margin-bottom:6px;color:var(--muted)}
select{width:100%;padding:11px;border:1px solid var(--border);border-radius:7px;background:var(--background);color:#fff;font-size:14px;margin-bottom:12px}
button{width:100%;padding:13px;border:0;border-radius:7px;background:var(--red);color:#fff;font-weight:800;font-size:14px;cursor:pointer;margin-bottom:9px}
button:hover{background:var(--red-hover)}
button:disabled{opacity:.6}
button.alt{background:var(--surface-light);border:1px solid var(--border)}
button.alt:hover{background:#30333b}
.hidden{display:none!important}
#botWrap{margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
.boardbox{position:relative}
#arrows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.board{touch-action:none;-webkit-user-select:none;user-select:none}
.sq.pre{box-shadow:inset 0 0 0 100px #2b6fd499}
.sq.dsrc span{opacity:.3}
.ghost{position:fixed;pointer-events:none;z-index:100;transform:translate(-50%,-50%);font-family:"Segoe UI Symbol",serif;line-height:1}
.flag{height:13px;border-radius:2px;vertical-align:middle;margin-right:6px}
.prefs{display:flex;gap:18px;margin-bottom:14px;font-size:13px;color:var(--muted)}
.prefs label{display:flex;align-items:center;gap:6px;margin:0;font-weight:400;font-size:13px;cursor:pointer}
.amsg{font-size:12px;color:var(--muted);margin-bottom:9px;min-height:16px}
.acc{font-size:13px;line-height:1.7;margin-bottom:10px}
.evalline{font-size:13px;color:var(--muted);margin-bottom:10px}
.ctl{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:9px}.ctl button{margin:0}
#moves .mv{cursor:pointer;padding:1px 4px;border-radius:4px}
#moves .mv:hover{background:var(--surface-light)}
#moves .mv.cur{background:var(--red);color:#fff}
@media(max-width:700px){
  main{padding:12px 6px;gap:14px}
  .board-wrap{width:min(100vw - 12px,560px)}
  .sq{font-size:min(10.5vw,52px)}
  .panel{width:100%;padding:16px}
  #moves{height:120px}
  .player{font-size:14px}.clock{font-size:18px;min-width:78px;padding:4px 8px}
}

.tb[data-tip],.title-badge[data-tip]{position:relative;cursor:help}
.tb[data-tip]:hover::after,.title-badge[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%);background:#000;color:#fff;font-size:11px;font-weight:700;letter-spacing:0;text-transform:none;white-space:nowrap;padding:5px 9px;border-radius:5px;border:1px solid #30333b;z-index:60;pointer-events:none}
@media(max-width:700px){
  header,.topbar{height:auto!important;flex-wrap:wrap;padding:10px 4%!important;gap:6px 12px}
  header nav,.topbar nav{width:100%;overflow-x:auto;gap:18px!important;padding:4px 0 6px;scrollbar-width:none}
  header nav a,.topbar nav a{display:inline-block!important;white-space:nowrap}
  header nav a[hidden],.topbar nav a[hidden]{display:none!important}
  button,select,.btn{min-height:44px}
}
</style>
</head>
<body>
<header>
  <a class="logo" href="index.html">CHESS<span>.</span></a>
  <nav><a href="index.html">Home</a><a href="rankings.html">Rankings</a><a href="tournaments.html">Tournaments</a><a href="player.html">Players</a><a href="player.html" class="nav-user" id="authLink">Account</a><a href="#" id="logoutLink">Log out</a></nav>
</header>

<main>
  <div class="board-wrap">
    <div class="player" id="topPlayer"></div>
    <div class="boardbox"><div class="board" id="board"></div><svg id="arrows" viewBox="0 0 8 8"></svg></div>
    <div class="player" id="bottomPlayer"></div>
  </div>
  <aside class="panel">
    <h2 id="gameTitle">Game</h2>
    <div id="status">Loading…</div>
    <div id="moves"></div>
    <div class="prefs">
      <label><input type="checkbox" id="optSound" checked> Sound</label>
      <label><input type="checkbox" id="optPremove"> Premove</label>
    </div>
    <div id="tcWrap">
      <label for="tc">Time control</label>
      <select id="tc">
        <option value="1:0">1 + 0 · Bullet</option>
        <option value="3:0">3 + 0 · Blitz</option>
        <option value="3:2">3 + 2 · Blitz</option>
        <option value="5:0">5 + 0 · Blitz</option>
        <option value="10:0" selected>10 + 0 · Rapid</option>
        <option value="15:10">15 + 10 · Rapid</option>
        <option value="30:0">30 + 0 · Classical</option>
      </select>
    </div>
    <button id="findBtn">Find game</button>
    <div id="botWrap">
      <label for="botLevel">Play vs computer (unrated)</label>
      <select id="botLevel">
        <option value="0">Beginner</option>
        <option value="1">Casual</option>
        <option value="2" selected>Club</option>
        <option value="3">Strong</option>
        <option value="4">Master</option>
      </select>
      <select id="botColor">
        <option value="w">Play as White</option>
        <option value="b">Play as Black</option>
        <option value="r">Random colour</option>
      </select>
      <button id="botBtn" class="alt">Play computer</button>
    </div>
    <button id="resignBtn" class="alt hidden">Resign</button>
    <div id="analysisWrap" class="hidden">
      <button id="analyzeBtn" class="alt">Analyze game</button>
      <div id="analysisMsg" class="amsg"></div>
      <div id="reviewCtl" class="hidden">
        <div class="acc" id="accText"></div>
        <div class="ctl">
          <button id="rvFirst" class="alt">⏮</button><button id="rvPrev" class="alt">◀</button>
          <button id="rvNext" class="alt">▶</button><button id="rvLast" class="alt">⏭</button>
        </div>
        <div class="evalline" id="evalText"></div>
        <button id="rvClose" class="alt">Close analysis</button>
      </div>
    </div>
  </aside>
</main>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
import { Chess } from "https://esm.sh/chess.js@1.0.0";

const supabase = createClient(
  "https://hloyebtuqozxalewkbgp.supabase.co",
  "sb_publishable_LhVKo17KVegP0q_qWqghnw_wkOYn3l4"
);
const $ = (id) => document.getElementById(id);
const GLYPH = { k: "♚", q: "♛", r: "♜", b: "♝", n: "♞", p: "♟" };
const PF = "username,title,avatar_url,country,bullet_rating,blitz_rating,rapid_rating,classical_rating";
const SELECT = `*, white:profiles!games_white_id_fkey(${PF}), black:profiles!games_black_id_fkey(${PF})`;

const { data: { session } } = await supabase.auth.getSession();
if (!session) { location.href = "login.html"; throw new Error("not logged in"); }
const me = session.user.id;
$("logoutLink").onclick = async (e) => {
  e.preventDefault();
  await supabase.auth.signOut();
  location.href = "login.html";
};

const { data: myProfile } = await supabase.from("profiles").select(PF).eq("id", me).maybeSingle();
const myName = myProfile?.username || session.user.user_metadata?.username || "You";
{
  const al = $("authLink");
  al.href = "player.html?user=" + encodeURIComponent(myName);
  al.textContent = "";
  if (myProfile?.title) {
    const b = document.createElement("span");
    b.className = "tb";
    b.textContent = myProfile.title.toUpperCase();
    al.append(b);
  }
  al.append(myName);
}
// Show as "online" on the rankings page
const presence = supabase.channel("online", { config: { presence: { key: me } } });
presence.subscribe(async (st) => { if (st === "SUBSCRIBED") await presence.track({ at: Date.now() }); });

let game = null, chess = new Chess(), selected = null, targets = [], channel = null;
let offset = 0, claiming = false;
let arrows = [], premove = null, dragging = null, arrowStart = null;
let review = null, analysisHandler = null, analyzing = false, quotaFor = null, lastSnd = null;

const prefs = { sound: true, premove: false };
try { Object.assign(prefs, JSON.parse(localStorage.getItem("chessPrefs") || "{}")); } catch {}
const savePrefs = () => { try { localStorage.setItem("chessPrefs", JSON.stringify(prefs)); } catch {} };

/* ---------- sounds (synthesised, no files needed) ---------- */
let actx = null;
function initAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch {} }
  if (actx && actx.state === "suspended") actx.resume();
}
function tone(freq, dur, type, vol, when = 0, slideTo) {
  const t = actx.currentTime + when, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + 0.03);
}
function playSound(kind) {
  if (!prefs.sound || !actx || actx.state !== "running") return;
  if (kind === "move") tone(240, 0.07, "triangle", 0.22, 0, 150);
  else if (kind === "capture") { tone(190, 0.1, "square", 0.1, 0, 90); tone(340, 0.05, "triangle", 0.16); }
  else if (kind === "check") { tone(520, 0.09, "sine", 0.18); tone(720, 0.13, "sine", 0.18, 0.09); }
  else if (kind === "end") { tone(440, 0.18, "sine", 0.18); tone(330, 0.18, "sine", 0.18, 0.17); tone(262, 0.3, "sine", 0.18, 0.34); }
}

const myColor = () => !game ? null : game.white_id === me ? "w" : game.black_id === me ? "b" : null;
const canMove = () => game && game.status === "active" && myColor() === chess.turn() && !chess.isGameOver();
const ply = () => chess.history().length;
const selectedTc = () => { const [m, i] = $("tc").value.split(":").map(Number); return m * 60000 + 40 * i * 1000; };
const catOf = (t) => (t < 180000 ? "bullet" : t < 480000 ? "blitz" : t < 1500000 ? "rapid" : "classical");

async function syncOffset() {
  const { data } = await supabase.rpc("server_now");
  if (data) offset = new Date(data).getTime() - Date.now();
}

function applyRow(row) {
  if (game?.id !== row.id) { review = null; premove = null; arrows = []; }
  game = row;
  chess = new Chess();
  if (row.pgn) chess.loadPgn(row.pgn);
  selected = null; targets = [];
  render();
  runPremove();
}

async function fetchGame(id) {
  const { data, error } = await supabase.from("games").select(SELECT).eq("id", id).maybeSingle();
  return error ? null : data;
}

async function openGame(id) {
  const row = await fetchGame(id);
  if (!row) { $("status").textContent = "Game not found."; return; }
  await syncOffset();
  history.replaceState({}, "", "?game=" + id);
  if (channel) supabase.removeChannel(channel);
  channel = supabase.channel("game-" + id)
    .on("postgres_changes", { event: "UPDATE", schema: "public", table: "games", filter: `id=eq.${id}` },
      async () => { const r = await fetchGame(id); if (r) applyRow(r); })
    .subscribe();
  applyRow(row);
}

async function resume() {
  const since = new Date(Date.now() - 5 * 60e3).toISOString();
  const { data } = await supabase.from("games").select("id,status,created_at")
    .or(`white_id.eq.${me},black_id.eq.${me}`).in("status", ["waiting", "active"])
    .order("created_at", { ascending: false }).limit(5);
  const g = (data || []).find(x => x.status === "active" || x.created_at > since);
  if (g) { await openGame(g.id); return true; }
  return false;
}

async function findGame() {
  $("findBtn").disabled = true;
  try {
    if (await resume()) return;
    const [mins, inc] = $("tc").value.split(":").map(Number);
    const base_ms = mins * 60000, inc_ms = inc * 1000;
    const since = new Date(Date.now() - 5 * 60e3).toISOString();
    const { data: open } = await supabase.from("games").select("id")
      .eq("status", "waiting").is("black_id", null).neq("white_id", me)
      .eq("base_ms", base_ms).eq("inc_ms", inc_ms)
      .gte("created_at", since).order("created_at").limit(1);
    if (open?.length) {
      const { data, error } = await supabase.from("games")
        .update({ black_id: me, status: "active" })
        .eq("id", open[0].id).is("black_id", null).select("id");
      if (!error && data?.length) { await openGame(data[0].id); return; }
    }
    const { data, error } = await supabase.from("games")
      .insert({ white_id: me, base_ms, inc_ms }).select("id").single();
    if (error) { $("status").textContent = "Couldn't create a game: " + error.message; return; }
    await openGame(data.id);
  } finally { $("findBtn").disabled = false; }
}

async function makeMove(from, to) {
  if (game.local) {
    try { if (!chess.move({ from, to, promotion: "q" })) return; } catch { return; }
    return afterLocalMove();
  }
  const oldFen = game.fen;
  try { if (!chess.move({ from, to, promotion: "q" })) return; } catch { return; }
  const update = { fen: chess.fen(), pgn: chess.pgn() };
  if (chess.isGameOver()) {
    update.status = "finished";
    update.result = chess.isCheckmate() ? (chess.turn() === "w" ? "0-1" : "1-0") : "1/2-1/2";
  }
  selected = null; targets = [];
  render();
  const { error } = await supabase.from("games").update(update).eq("id", game.id).eq("fen", oldFen);
  if (error) console.error(error);
  const fresh = await fetchGame(game.id);
  if (fresh) applyRow(fresh);
}

async function resign() {
  if (!game || game.status !== "active" || !myColor()) return;
  if (!confirm("Resign this game?")) return;
  if (game.local) {
    game.status = "finished";
    game.result = myColor() === "w" ? "0-1" : "1-0";
    return render();
  }
  const result = myColor() === "w" ? "0-1" : "1-0";
  await supabase.from("games").update({ status: "finished", result }).eq("id", game.id);
  const fresh = await fetchGame(game.id);
  if (fresh) applyRow(fresh);
}

async function claimTimeout() {
  const result = myColor() === "w" ? "1-0" : "0-1";
  await supabase.from("games").update({ status: "finished", result })
    .eq("id", game.id).eq("status", "active").eq("fen", game.fen);
  const fresh = await fetchGame(game.id);
  if (fresh) applyRow(fresh);
}

/* ---------- board interaction: drag & drop, click-to-move, arrows, premoves ---------- */
const boardEl = $("board");
const interactive = () => game && !review && game.status === "active" && myColor() && !chess.isGameOver();
const myTurn = () => chess.turn() === myColor();

function sqFromEvent(e) {
  const r = boardEl.getBoundingClientRect();
  let x = Math.floor(((e.clientX - r.left) / r.width) * 8), y = Math.floor(((e.clientY - r.top) / r.height) * 8);
  if (x < 0 || x > 7 || y < 0 || y > 7) return null;
  if (myColor() === "b") { x = 7 - x; y = 7 - y; }
  return "abcdefgh"[x] + (8 - y);
}

function setPremove(from, to) { premove = { from, to }; selected = null; targets = []; render(); }
function runPremove() {
  if (!premove) return;
  if (!game || game.status !== "active") { premove = null; return; }
  if (chess.turn() !== myColor()) return;
  const pm = premove; premove = null;
  if (chess.moves({ square: pm.from, verbose: true }).some((m) => m.to === pm.to)) makeMove(pm.from, pm.to);
  else render();
}

function showGhost() {
  const src = boardEl.querySelector(`[data-sq="${dragging.from}"]`);
  src?.classList.add("dsrc");
  const g = document.createElement("div");
  g.id = "ghost"; g.className = "ghost " + dragging.piece.color;
  g.textContent = GLYPH[dragging.piece.type] + "\uFE0E";
  g.style.fontSize = src ? getComputedStyle(src).fontSize : "40px";
  document.body.append(g);
}
function moveGhost(e) { const g = $("ghost"); if (g) { g.style.left = e.clientX + "px"; g.style.top = e.clientY + "px"; } }
function hideGhost() { $("ghost")?.remove(); }

boardEl.addEventListener("pointerdown", (e) => {
  initAudio();
  const sq = sqFromEvent(e);
  if (!sq) return;
  if (e.button === 2) { arrowStart = sq; return; }          // right button: start an arrow
  if (e.button !== 0) return;
  if (arrows.length) { arrows = []; drawArrows(); }
  if (!interactive()) return;
  const piece = chess.get(sq);
  const own = piece && piece.color === myColor();
  if (selected && selected !== sq && !own) {
    if (myTurn() && targets.includes(sq)) return makeMove(selected, sq);
    if (!myTurn() && prefs.premove) return setPremove(selected, sq);
  }
  if (own && (myTurn() || prefs.premove)) {
    selected = sq;
    targets = myTurn() ? chess.moves({ square: sq, verbose: true }).map((m) => m.to) : [];
    dragging = { from: sq, piece, id: e.pointerId, moved: false, x: e.clientX, y: e.clientY };
    try { boardEl.setPointerCapture(e.pointerId); } catch {}
    render();
  } else {
    if (!myTurn() && premove) premove = null;
    selected = null; targets = [];
    render();
  }
});

boardEl.addEventListener("pointermove", (e) => {
  if (!dragging || e.pointerId !== dragging.id) return;
  if (!dragging.moved && Math.hypot(e.clientX - dragging.x, e.clientY - dragging.y) > 4) { dragging.moved = true; showGhost(); }
  if (dragging.moved) moveGhost(e);
});

boardEl.addEventListener("pointerup", (e) => {
  if (e.button === 2) {                                      // finish an arrow (or cancel a premove)
    const from = arrowStart; arrowStart = null;
    const to = sqFromEvent(e);
    if (!from || !to) return;
    if (from === to) { if (premove) { premove = null; render(); } return; }
    const i = arrows.findIndex((a) => a.from === from && a.to === to);
    if (i >= 0) arrows.splice(i, 1); else arrows.push({ from, to });
    drawArrows();
    return;
  }
  if (!dragging || e.pointerId !== dragging.id) return;
  const d = dragging; dragging = null; hideGhost();
  const to = sqFromEvent(e);
  if (d.moved && to && to !== d.from) {
    if (myTurn() && targets.includes(to)) return makeMove(d.from, to);
    if (!myTurn() && prefs.premove) return setPremove(d.from, to);
    selected = null; targets = [];
  }
  render();
});
boardEl.addEventListener("pointercancel", () => { if (dragging) { dragging = null; hideGhost(); render(); } });
boardEl.addEventListener("contextmenu", (e) => e.preventDefault());

/* ---------- arrows (right-click drag; also shows the engine's best move in analysis) ---------- */
function drawArrows() {
  const svg = $("arrows");
  svg.replaceChildren();
  const list = arrows.map((a) => ({ ...a, color: "rgba(0,150,80,.8)" }));
  if (review?.bestArrow) list.push({ ...review.bestArrow, color: "rgba(40,110,230,.85)" });
  const center = (sq) => {
    let x = "abcdefgh".indexOf(sq[0]), y = 8 - Number(sq[1]);
    if (myColor() === "b") { x = 7 - x; y = 7 - y; }
    return [x + 0.5, y + 0.5];
  };
  for (const a of list) {
    const [x1, y1] = center(a.from), [x2, y2] = center(a.to);
    const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy);
    if (!len) continue;
    const ux = dx / len, uy = dy / len, px = -uy, py = ux;
    const sx = x1 + ux * 0.18, sy = y1 + uy * 0.18, bx = x2 - ux * 0.4, by = y2 - uy * 0.4;
    const sw = 0.09, hw = 0.26;
    const pts = [[sx + px * sw, sy + py * sw], [bx + px * sw, by + py * sw], [bx + px * hw, by + py * hw],
      [x2 - ux * 0.06, y2 - uy * 0.06], [bx - px * hw, by - py * hw], [bx - px * sw, by - py * sw], [sx - px * sw, sy - py * sw]];
    const poly = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
    poly.setAttribute("points", pts.map((p) => p.join(",")).join(" "));
    poly.setAttribute("fill", a.color);
    svg.append(poly);
  }
}

/* ---------- post-game analysis (Stockfish in the browser) ---------- */
const winPct = (cp) => 50 + 50 * (2 / (1 + Math.exp(-0.00368208 * cp)) - 1);
const uciArrow = (u) => (u && u.length >= 4 && u !== "(none)" ? { from: u.slice(0, 2), to: u.slice(2, 4) } : null);
const amsg = (t) => { $("analysisMsg").textContent = t; };

async function refreshQuota() {
  const { data, error } = await supabase.rpc("use_analysis", { p_consume: false });
  if (error || analyzing || review) return;
  amsg(data === -1 ? "Unlimited analysis." : `${data} free analyses left today.`);
}

function evalFen(fen) {
  const c = new Chess(fen);
  if (c.isCheckmate()) return Promise.resolve({ cp: c.turn() === "w" ? -10000 : 10000, best: null });
  if (c.isDraw()) return Promise.resolve({ cp: 0, best: null });
  const stm = c.turn();
  return new Promise((resolve) => {
    let cp = 0;
    analysisHandler = (line) => {
      if (line.startsWith("info") && line.includes(" score ")) {
        const m = line.match(/score (cp|mate) (-?\d+)/);
        if (m) { const n = Number(m[2]); cp = m[1] === "mate" ? (n > 0 ? 10000 - n : -10000 - n) : n; }
      } else if (line.startsWith("bestmove")) {
        analysisHandler = null;
        resolve({ cp: stm === "w" ? cp : -cp, best: line.split(" ")[1] });
      }
    };
    engine.postMessage("setoption name Skill Level value 20");
    engine.postMessage(`position fen ${fen}`);
    engine.postMessage("go depth 12 movetime 350");
  });
}

async function startAnalysis() {
  if (!game || game.status !== "finished" || analyzing || chess.history().length < 2) return;
  const { error } = await supabase.rpc("use_analysis", { p_consume: true });
  if (error) { amsg(error.message); return; }
  analyzing = true; updateAnalysisUI();
  try { await loadEngine(); } catch (err) { analyzing = false; amsg(err.message); updateAnalysisUI(); return; }

  const gid = game.id, hist = chess.history({ verbose: true });
  const replay = new Chess(), fens = [replay.fen()];
  for (const m of hist) { replay.move(m.san); fens.push(replay.fen()); }
  const evals = [], best = [];
  for (let i = 0; i < fens.length; i++) {
    if (!game || game.id !== gid) { analysisHandler = null; analyzing = false; return; }
    amsg(`Analyzing… ${i}/${fens.length - 1}`);
    const r = await evalFen(fens[i]);
    evals.push(r.cp); best.push(r.best);
  }
  // move quality + accuracy (win-percentage loss, like Lichess)
  const marks = [], acc = { w: [], b: [] };
  for (let k = 0; k < hist.length; k++) {
    const white = k % 2 === 0, sign = white ? 1 : -1;
    const loss = Math.max(0, winPct(sign * evals[k]) - winPct(sign * evals[k + 1]));
    marks.push(loss >= 20 ? "??" : loss >= 10 ? "?" : loss >= 5 ? "?!" : "");
    acc[white ? "w" : "b"].push(Math.min(100, Math.max(0, 103.1668 * Math.exp(-0.04354 * loss) - 3.1669)));
  }
  const avg = (a) => (a.length ? Math.round(a.reduce((x, y) => x + y, 0) / a.length) : 0);
  analyzing = false;
  review = { positions: fens, evals, best, hist, sans: hist.map((m) => m.san), marks, acc: { w: avg(acc.w), b: avg(acc.b) }, idx: fens.length - 1, chess: null, bestArrow: null };
  amsg("");
  gotoReview(review.idx);
}

function gotoReview(i) {
  if (!review) return;
  review.idx = Math.max(0, Math.min(review.positions.length - 1, i));
  review.chess = new Chess(review.positions[review.idx]);
  review.bestArrow = uciArrow(review.best[review.idx]);
  selected = null; targets = [];
  render();
}

function renderReviewMoves() {
  let h = "";
  review.sans.forEach((san, i) => {
    if (i % 2 === 0) h += `<b>${i / 2 + 1}.</b> `;
    h += `<span class="mv${review.idx === i + 1 ? " cur" : ""}" data-i="${i + 1}">${san}${review.marks[i]}</span> `;
    if (i % 2 === 1) h += "<br>";
  });
  $("moves").innerHTML = h;
  $("moves").querySelectorAll(".mv").forEach((el) => { el.onclick = () => gotoReview(Number(el.dataset.i)); });
  $("moves").querySelector(".cur")?.scrollIntoView({ block: "nearest" });
}

function updateAnalysisUI() {
  const can = game && game.status === "finished" && chess.history().length >= 2;
  $("analysisWrap").classList.toggle("hidden", !can);
  $("analyzeBtn").classList.toggle("hidden", !!review || analyzing);
  $("reviewCtl").classList.toggle("hidden", !review);
  if (can && !review && !analyzing && quotaFor !== game.id) { quotaFor = game.id; refreshQuota(); }
  if (review) {
    $("accText").textContent = `Accuracy: White ${review.acc.w}% · Black ${review.acc.b}%`;
    const cp = review.evals[review.idx];
    let t = "Eval: " + (Math.abs(cp) >= 9000 ? (cp > 0 ? "White mates" : "Black mates") : (cp > 0 ? "+" : "") + (cp / 100).toFixed(2));
    const b = review.best[review.idx];
    if (b && b !== "(none)") {
      try { const c = new Chess(review.positions[review.idx]); t += " · Best: " + c.move({ from: b.slice(0, 2), to: b.slice(2, 4), promotion: b[4] }).san; } catch {}
    }
    $("evalText").textContent = t;
  }
}

/* ---------- play vs computer (Stockfish in a Web Worker) ---------- */
const LEVELS = [
  { name: "Beginner", skill: 0,  depth: 1,  ms: 150 },
  { name: "Casual",   skill: 4,  depth: 5,  ms: 300 },
  { name: "Club",     skill: 9,  depth: 9,  ms: 600 },
  { name: "Strong",   skill: 15, depth: 13, ms: 1000 },
  { name: "Master",   skill: 20, depth: 18, ms: 1800 },
];
const ENGINE_URLS = [
  "https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js",
  "https://cdn.jsdelivr.net/npm/stockfish.js@10.0.2/stockfish.js",
];
let engine = null, engineReady = null, thinkingFen = null;

function loadEngine() {
  if (engineReady) return engineReady;
  engineReady = new Promise((resolve, reject) => {
    let i = 0;
    const tryNext = () => {
      if (i >= ENGINE_URLS.length) return reject(new Error("Couldn't load the chess engine. Check your connection and try again."));
      const blob = new Blob([`importScripts(${JSON.stringify(ENGINE_URLS[i++])});`], { type: "text/javascript" });
      const w = new Worker(URL.createObjectURL(blob));
      const timer = setTimeout(() => { w.terminate(); tryNext(); }, 12000);
      w.onerror = () => { clearTimeout(timer); w.terminate(); tryNext(); };
      w.onmessage = (e) => {
        if (String(e.data).includes("uciok")) {
          clearTimeout(timer);
          w.onerror = null;
          w.onmessage = onEngineMsg;
          engine = w;
          resolve(w);
        }
      };
      w.postMessage("uci");
    };
    tryNext();
  });
  engineReady.catch(() => { engineReady = null; });
  return engineReady;
}

function onEngineMsg(e) {
  const line = String(e.data);
  if (analysisHandler) return analysisHandler(line);
  if (!line.startsWith("bestmove")) return;
  if (!game?.local || game.status !== "active" || chess.fen() !== thinkingFen) return;
  const mv = line.split(" ")[1];
  if (!mv || mv === "(none)") return;
  try { chess.move({ from: mv.slice(0, 2), to: mv.slice(2, 4), promotion: mv[4] }); } catch { return; }
  afterLocalMove();
}

function thinkBot() {
  const lv = LEVELS[game.level];
  thinkingFen = chess.fen();
  engine.postMessage(`setoption name Skill Level value ${lv.skill}`);
  engine.postMessage(`position fen ${thinkingFen}`);
  engine.postMessage(`go depth ${lv.depth} movetime ${lv.ms}`);
}

function afterLocalMove() {
  game.fen = chess.fen();
  game.pgn = chess.pgn();
  if (chess.isGameOver()) {
    game.status = "finished";
    game.result = chess.isCheckmate() ? (chess.turn() === "w" ? "0-1" : "1-0") : "1/2-1/2";
  }
  selected = null; targets = [];
  render();
  if (game.status === "active" && chess.turn() !== myColor()) thinkBot();
  else runPremove();
}

async function startBotGame() {
  const level = Number($("botLevel").value);
  let col = $("botColor").value;
  if (col === "r") col = Math.random() < 0.5 ? "w" : "b";
  $("botBtn").disabled = true;
  $("status").textContent = "Loading engine…";
  try { await loadEngine(); }
  catch (err) { $("status").textContent = err.message; $("botBtn").disabled = false; return; }
  $("botBtn").disabled = false;

  if (channel) { supabase.removeChannel(channel); channel = null; }
  review = null; premove = null; arrows = [];
  history.replaceState({}, "", location.pathname);
  chess = new Chess();
  selected = null; targets = [];
  const bot = { username: LEVELS[level].name + " (computer)" }, you = { username: myName, title: myProfile?.title };
  game = {
    local: true, id: "local", level, status: "active", result: null,
    fen: chess.fen(), pgn: "",
    white_id: col === "w" ? me : "bot", black_id: col === "w" ? "bot" : me,
    white: col === "w" ? you : bot, black: col === "w" ? bot : you,
    white_ms: 0, black_ms: 0, base_ms: 0, inc_ms: 0, category: "computer",
  };
  render();
  if (col === "b") thinkBot();
}

/* ---------- clocks ---------- */
function clockRunning(c) {
  return game && !game.local && game.status === "active" && chess.turn() === c && ply() >= 2;
}
function clockMs(c) {
  if (game.local) return Infinity;
  let ms = c === "w" ? game.white_ms : game.black_ms;
  if (clockRunning(c)) ms -= Date.now() + offset - new Date(game.last_move_at).getTime();
  return Math.max(0, ms);
}
function fmt(ms) {
  if (!isFinite(ms)) return "—";
  if (ms < 10000) return "0:0" + (ms / 1000).toFixed(1);
  const s = Math.floor(ms / 1000), m = Math.floor(s / 60);
  return (m >= 60 ? Math.floor(m / 60) + ":" + String(m % 60).padStart(2, "0") : m) + ":" + String(s % 60).padStart(2, "0");
}
function tick() {
  if (!game) return;
  const flip = myColor() === "b";
  for (const [id, c] of [["topClock", flip ? "w" : "b"], ["bottomClock", flip ? "b" : "w"]]) {
    const el = $(id); if (!el) continue;
    const ms = clockMs(c);
    el.textContent = fmt(ms);
    el.classList.toggle("run", clockRunning(c));
    el.classList.toggle("low", isFinite(ms) && ms < 10000);
  }
  const mover = chess.turn();
  if (clockRunning(mover) && clockMs(mover) <= 0 && myColor() && myColor() !== mover && !claiming) {
    claiming = true;
    claimTimeout().finally(() => setTimeout(() => (claiming = false), 1500));
  }
}
setInterval(tick, 100);
setInterval(() => game && game.status === "active" && syncOffset(), 60000);

/* ---------- render ---------- */
function render() {
  const flip = myColor() === "b";
  const view = review ? review.chess : chess;
  const board = view.board();
  const hist = review ? review.hist.slice(0, review.idx) : chess.history({ verbose: true });
  const last = hist.at(-1);

  { // sounds + clear arrows when the position changes
    const n = chess.history().length, id = game ? game.id : null, st = game?.status;
    if (!lastSnd || lastSnd.id !== id) lastSnd = { id, n, st };
    else if (n !== lastSnd.n || st !== lastSnd.st) {
      if (n !== lastSnd.n) arrows = [];
      const lm = chess.history({ verbose: true }).at(-1);
      if (st === "finished" && lastSnd.st !== "finished") playSound("end");
      else if (lm && n > lastSnd.n) playSound(/[#+]/.test(lm.san) ? "check" : lm.captured ? "capture" : "move");
      lastSnd = { id, n, st };
    }
  }

  let kingSq = null;
  if (view.inCheck()) {
    for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
      const p = board[r][c];
      if (p && p.type === "k" && p.color === view.turn()) kingSq = "abcdefgh"[c] + (8 - r);
    }
  }
  const el = $("board");
  el.innerHTML = "";
  for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
    const rr = flip ? 7 - r : r, cc = flip ? 7 - c : c;
    const sq = "abcdefgh"[cc] + (8 - rr);
    const p = board[rr][cc];
    const d = document.createElement("div");
    d.className = "sq " + ((rr + cc) % 2 === 0 ? "light" : "dark")
      + (last && (last.from === sq || last.to === sq) ? " last" : "")
      + (sq === selected ? " sel" : "")
      + (sq === kingSq ? " check" : "")
      + (premove && (premove.from === sq || premove.to === sq) ? " pre" : "")
      + (targets.includes(sq) ? " target" : "");
    d.dataset.sq = sq;
    if (p) d.innerHTML = `<span class="${p.color}">${GLYPH[p.type]}\uFE0E</span>`;
    el.appendChild(d);
  }

  const esc = (t) => String(t).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
  const cat = game ? game.category : catOf(selectedTc());
  const info = (p, label) => {
    if (!p) return `<span>${label === "Black" && game ? "Waiting…" : "—"}</span>`;
    const r = p[cat + "_rating"];
    return `<span>${p.country ? `<img class="flag" src="https://flagcdn.com/w20/${esc(String(p.country).toLowerCase())}.png" alt="">` : ""}${p.avatar_url ? `<img class="av" src="${esc(p.avatar_url)}" alt="">` : ""}` +
      `${p.title ? `<span class="tb">${esc(p.title.toUpperCase())}</span>` : ""}${esc(p.username)}` +
      `${r != null ? ` <small>(${Math.round(Number(r))})</small>` : ""}` +
      `${label ? ` <small>${label}</small>` : ""}</span>`;
  };
  const sideP = (c) => (game ? game[c === "w" ? "white" : "black"] : null);
  const row = (c, id) => `${info(sideP(c), c === "w" ? "White" : "Black")}<span class="clock" id="${id}">${game ? fmt(clockMs(c)) : ""}</span>`;
  if (game) {
    $("topPlayer").innerHTML = row(flip ? "w" : "b", "topClock");
    $("bottomPlayer").innerHTML = row(flip ? "b" : "w", "bottomClock");
  } else {
    // No game yet: show yourself with your rating for the selected time control
    $("topPlayer").innerHTML = "";
    $("bottomPlayer").innerHTML = `${info(myProfile, "")}<span class="clock" id="bottomClock"></span>`;
  }

  if (review) renderReviewMoves();
  else {
    const sans = chess.history();
    let html = "";
    for (let i = 0; i < sans.length; i += 2)
      html += `<b>${i / 2 + 1}.</b> ${sans[i]} ${sans[i + 1] || ""}<br>`;
    $("moves").innerHTML = html;
    $("moves").scrollTop = $("moves").scrollHeight;
  }

  let text = "Choose a time control and press “Find game”.";
  if (game) {
    if (game.status === "waiting") text = "Waiting for an opponent to join… (you are White)";
    else if (game.status === "finished") {
      const w = game.result === "1-0" ? "White wins" : game.result === "0-1" ? "Black wins" : "Draw";
      const how = chess.isCheckmate() ? " by checkmate"
        : chess.isGameOver() ? ""
        : (!game.local && (game.white_ms === 0 || game.black_ms === 0)) ? " on time" : " (resignation)";
      text = `Game over — ${w}${how}.`;
      const sg = (n) => (n > 0 ? "+" : n < 0 ? "−" : "±") + Math.abs(n);
      if (game.white_delta != null && (game.white_delta || game.black_delta))
        text += `\n${game.category} rating: White ${sg(game.white_delta)}, Black ${sg(game.black_delta)}`;
    } else if (!myColor()) text = `Spectating — ${chess.turn() === "w" ? "White" : "Black"} to move.`;
    else text = chess.turn() === myColor() ? "Your move." + (chess.inCheck() ? " You are in check!" : "") : "Opponent's move…";
  }
  $("status").style.whiteSpace = "pre-line";
  $("status").textContent = text;
  $("gameTitle").textContent = !game ? "Game" : game.local ? `Computer · ${LEVELS[game.level].name}` : `${game.base_ms / 60000}+${game.inc_ms / 1000} · ${game.category}`;

  const idle = !game || game.status === "finished";
  $("findBtn").classList.toggle("hidden", !idle);
  $("tcWrap").classList.toggle("hidden", !idle);
  $("botWrap").classList.toggle("hidden", !idle);
  $("findBtn").textContent = game ? "Find new game" : "Find game";
  $("resignBtn").classList.toggle("hidden", !(game && game.status === "active" && myColor()));
  updateAnalysisUI();
  drawArrows();
  tick();
}

$("findBtn").onclick = () => { review = null; premove = null; arrows = []; game = null; findGame(); };
$("optSound").checked = prefs.sound;
$("optPremove").checked = prefs.premove;
$("optSound").onchange = (e) => { prefs.sound = e.target.checked; savePrefs(); initAudio(); playSound("move"); };
$("optPremove").onchange = (e) => { prefs.premove = e.target.checked; if (!prefs.premove) premove = null; savePrefs(); render(); };
$("analyzeBtn").onclick = startAnalysis;
$("rvFirst").onclick = () => gotoReview(0);
$("rvPrev").onclick = () => gotoReview(review.idx - 1);
$("rvNext").onclick = () => gotoReview(review.idx + 1);
$("rvLast").onclick = () => gotoReview(review.positions.length - 1);
$("rvClose").onclick = () => { review = null; render(); };
addEventListener("keydown", (e) => {
  if (!review) return;
  if (e.key === "ArrowLeft") gotoReview(review.idx - 1);
  else if (e.key === "ArrowRight") gotoReview(review.idx + 1);
});
$("tc").onchange = () => { if (!game) render(); };
$("resignBtn").onclick = resign;
$("botBtn").onclick = startBotGame;

const urlGame = new URLSearchParams(location.search).get("game");
if (urlGame) await openGame(urlGame);
else if (!(await resume())) render();
</script>
